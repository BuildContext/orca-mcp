# NAS-258 — capability file roots. Recreated on boot.
# worker-caps is 0711 so 994 can open a known name but cannot list siblings.
d /run/orca-mcp 0755 root root -
d /run/orca-mcp/worker-caps 0711 root root -
d /run/orca-mcp/worker-caps/by-task 0711 root root -
d /run/orca-mcp/cap-stage 0700 orca orca -
